[package]
name = "gps-to-mqtt"
version = "0.8.0"
edition = "2024"
rust-version = "1.89"
authors = ["askrejans"]
description = "Universal GNSS (NMEA-0183) bridge to MQTT, HTTP, gpsd and NMEA network outputs"
license = "GPL-3.0-only"
repository = "https://github.com/askrejans/gps-to-mqtt"
readme = "README.md"
keywords = ["gps", "gnss", "nmea", "mqtt", "gpsd"]
categories = ["command-line-utilities", "embedded", "network-programming"]

[dependencies]
# Async runtime
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "net", "io-util", "time", "sync", "signal", "fs"] }
tokio-util = "0.7.20"
futures-util = "0.3.34"

# Serial port
serialport = "4.10.1"

# Configuration
config = "0.15.27"
serde = { version = "1.0.229", features = ["derive", "rc"] }
serde_json = "1.0.154"
dotenvy = "0.15.7"

# CLI
clap = { version = "4.6.7", features = ["derive"] }

# MQTT (async client, rustls)
rumqttc = "0.25.1"

# Logging and tracing
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "json", "fmt"] }

# TUI
ratatui = "0.30.2"
crossterm = { version = "0.29.0", features = ["event-stream"] }

# Error handling
thiserror = "2.0.21"
anyhow = "1.0.104"

# Time
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std", "serde"] }

# HTTP API (health, Prometheus text exposition, REST, SSE)
axum = "0.8.9"

[target.'cfg(target_os = "linux")'.dependencies]
# Kernel clock state (adjtimex) for `<base>/health` clockSynced
libc = "0.2.191"

[dev-dependencies]
tower = { version = "0.5.3", features = ["util"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
