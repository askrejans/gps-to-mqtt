services:

  gps-to-mqtt:
    # Option A – build locally from source
    build: .
    # Option B – pre-built image
    # image: ghcr.io/askrejans/gps-to-mqtt:latest

    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]

    # ── Serial receiver ──────────────────────────────────────────────────────
    # Map the device (auto-detection then finds it inside the container).
    # Stable paths under /dev/serial/by-id/ survive re-plugging.
    # devices:
    #   - /dev/ttyACM0:/dev/ttyACM0

    environment:
      # Source: serial | tcp | udp | gpsd | file
      GPS_TO_MQTT_CONNECTION_TYPE: serial
      GPS_TO_MQTT_PORT_NAME: auto            # or /dev/ttyACM0
      GPS_TO_MQTT_BAUD_RATE: "0"             # 0 = auto-detect

      # TCP bridge / gpsd source
      # GPS_TO_MQTT_TCP_HOST: 192.168.1.10
      # GPS_TO_MQTT_TCP_PORT: "9001"

      # Receiver profile + rate (ublox | mediatek | quectel | generic)
      # GPS_TO_MQTT_RECEIVER: ublox
      # GPS_TO_MQTT_UPDATE_RATE_HZ: "10"

      # MQTT
      GPS_TO_MQTT_MQTT_ENABLED: "true"
      GPS_TO_MQTT_MQTT_HOST: mqtt.local
      GPS_TO_MQTT_MQTT_PORT: "1883"
      GPS_TO_MQTT_MQTT_BASE_TOPIC: /CAR/GPS
      GPS_TO_MQTT_MQTT_FORMATS: legacy,json,g86   # + homeassistant, owntracks
      # GPS_TO_MQTT_MQTT_USERNAME: gps
      # GPS_TO_MQTT_MQTT_PASSWORD_FILE: /run/secrets/mqtt_password

      # HTTP API + Prometheus (bind 0.0.0.0 inside the container)
      GPS_TO_MQTT_HTTP_ENABLED: "true"
      GPS_TO_MQTT_HTTP_BIND: 0.0.0.0
      GPS_TO_MQTT_HTTP_PORT: "9090"
      # GPS_TO_MQTT_HTTP_TOKEN: change-me

      # Network re-broadcast
      # GPS_TO_MQTT_NMEA_TCP_LISTEN: 0.0.0.0:10110
      # GPS_TO_MQTT_GPSD_LISTEN: 0.0.0.0:2947

      GPS_TO_MQTT_LOG_LEVEL: info

    ports:
      - "127.0.0.1:9090:9090"     # HTTP API / metrics (loopback only)
      # - "10110:10110"           # NMEA TCP
      # - "2947:2947"             # gpsd

    healthcheck:
      test: ["CMD", "gps-to-mqtt", "--healthcheck"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3

    # secrets:
    #   - mqtt_password

    # Mount a settings.toml instead of / in addition to env vars (env wins)
    # volumes:
    #   - ./settings.toml:/etc/gps-to-mqtt/settings.toml:ro

# secrets:
#   mqtt_password:
#     file: ./mqtt_password.txt
